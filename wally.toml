[package]
name = "bruka/peekabu-game-systems"
version = "0.1.0"
registry = "https://github.com/UpliftGames/wally-index"
realm = "shared"

[dependencies]
ByteNetMax = "elitriare/bytenet-max@0.2.5" # The sanctioned transport for discrete/event packets — reach for this, not raw RemoteEvents. Live: Shared/Events/DebuggerEvents.luau. See docs/architecture.md (Networking).
Promise = "evaera/promise@4.0.0" # Standard async primitive for yielding/parallel work. Live: DebuggerServiceServer (per-service getState isolation). See docs/architecture.md (Provisioned dependencies).
Janitor = "howmanysmall/janitor@1.18.3"
Signal = "lightwxve/signalplus@3.5.0" # This is not an official release by creator
sift = "csqrl/sift@0.0.11" # Non necessary library, but recommended for table utils
Cmdr = "evaera/cmdr@1.12.0"
Observers = "sleitnick/observers@0.5.0" # observePlayer/observeCharacter/observeTag/observeAttribute
Charm = "littensy/charm@0.11.0" # atomic reactive state
CharmSync = "littensy/charm-sync@0.4.0" # server->client atom replication
React = "jsdotlua/react@17.2.1" # React-lua (ReactJS 17 for Luau)
ReactRoblox = "jsdotlua/react-roblox@17.2.1" # React renderer for Roblox instances
ReactCharm = "littensy/react-charm@0.4.0" # useAtom hook bridging Charm into React

[server-dependencies]
ProfileStore = "lm-loleris/profilestore@1.0.3" # This is not an official release by creator

[dev-dependencies]
TestEZ = "roblox/testez@0.4.1"