<title>Ring Hit Sound</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Libre+Franklin:wght@400;600;800&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Layout: an audition log — one filed form per sound, candidate rows with a player and a stamp-to-pick button */
:root{
  --paper:#EEF0E8; --sheet:#FAFBF6; --ink:#1D2725; --muted:#5C6B67; --rule:#C9D1CB;
  --teal:#1F6F66; --teal-soft:#DCEBE7; --stamp:#B8402A; --stamp-soft:#F6E1DA; --gold:#9A6F12; --gold-soft:#F5EAD0;
  --display:"Special Elite","Courier New",monospace;
  --body:"Libre Franklin","Segoe UI",system-ui,sans-serif;
  --mono:"Courier Prime","Courier New",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#141A19; --sheet:#1B2321; --ink:#E4EAE6; --muted:#9AA9A4; --rule:#33403D;
  --teal:#5FB8AA; --teal-soft:#1F3632; --stamp:#E8785F; --stamp-soft:#3A2420; --gold:#E0B44E; --gold-soft:#3A3020; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#141A19; --sheet:#1B2321; --ink:#E4EAE6; --muted:#9AA9A4; --rule:#33403D;
  --teal:#5FB8AA; --teal-soft:#1F3632; --stamp:#E8785F; --stamp-soft:#3A2420; --gold:#E0B44E; --gold-soft:#3A3020; color-scheme:dark}
body{background:var(--paper);color:var(--ink);font:15px/1.55 var(--body);padding-inline:16px;padding-block:24px 64px}
.wrap{max-width:900px;margin:0 auto;display:grid;gap:22px}
header{background:var(--sheet);border:1px solid var(--rule);padding:24px clamp(16px,4vw,36px);display:grid;gap:10px}
.form-id{font:700 12px/1 var(--mono);letter-spacing:.12em;color:var(--muted);text-transform:uppercase;display:flex;flex-wrap:wrap;gap:8px 20px}
h1{font:400 clamp(28px,6vw,40px)/1.1 var(--display);margin:0}
p{margin:0;max-width:70ch}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.count{font:700 14px/1 var(--mono);font-variant-numeric:tabular-nums}
.meter{flex:1;min-width:140px;height:8px;background:var(--rule);position:relative}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--teal);width:0}
.status{font:400 13px/1.4 var(--mono);color:var(--muted)}
.sound{background:var(--sheet);border:1px solid var(--rule);padding:18px clamp(14px,3.5vw,28px);display:grid;gap:12px;position:relative}
.sound.done{border-color:var(--teal)}
.shead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.num{font:700 13px/1 var(--mono);color:var(--muted)}
.sound h2{font:400 22px/1.2 var(--display);margin:0}
.key{font:400 12px/1 var(--mono);color:var(--muted)}
.picked{margin-left:auto;font:400 14px/1 var(--display);color:var(--teal);border:2px solid var(--teal);padding:4px 8px;transform:rotate(-2deg)}
.picked.none{color:var(--stamp);border-color:var(--stamp)}
.for{color:var(--muted);font-size:14px}
.cands{display:grid;gap:8px}
.cand{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:10px 12px;border:1px solid var(--rule)}
.cand.on{border-color:var(--teal);background:var(--teal-soft)}
.letter{font:700 18px/1 var(--mono);color:var(--teal);text-align:center}
.meta{min-width:0;display:grid;gap:4px}
.src{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:6px;font:700 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase}
.tags span{padding:3px 5px;background:var(--paper);color:var(--muted)}
.tags .Library{color:var(--teal)} .tags .Generated{color:var(--gold)} .tags .Mix{color:var(--stamp)} .tags .In-house{color:var(--stamp)}
.tags .gpass{color:var(--teal)} .tags .gfail{color:var(--stamp)}
.note{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
audio{width:100%;height:34px;margin-top:2px}
.pick{font:700 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:9px 12px;border:1.5px solid var(--teal);background:var(--sheet);color:var(--teal);cursor:pointer;white-space:nowrap}
.pick:hover,.pick:focus-visible{background:var(--teal);color:var(--sheet);outline:none}
.cand.on .pick{background:var(--teal);color:var(--sheet)}
.foot{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.redo{font:700 12px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:8px 10px;border:1.5px dashed var(--stamp);background:transparent;color:var(--stamp);cursor:pointer}
.redo.on{background:var(--stamp-soft)}
.notein{flex:1;min-width:200px;font:14px/1.4 var(--body);padding:8px 10px;border:1px solid var(--rule);background:var(--paper);color:var(--ink)}
@media (max-width:560px){.cand{grid-template-columns:28px minmax(0,1fr)}.pick{grid-column:1/-1}}
</style>

const STORE_KEY = "sound-picks-ring-hit-soundring-hit-sound";
const picks = {};
let db = null;
const $ = (s, r=document) => r.querySelector(s);
const el = (t, cls, txt) => { const e=document.createElement(t); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; };
const DOC_PREFIX = "ringhit-";
function docId(n){ return DOC_PREFIX + String(n).padStart(2,"0"); }

function render(){
  const list = $("#list"); list.textContent = "";
  for (const s of SOUNDS){
    const p = picks[docId(s.n)] || {};
    const card = el("section","sound"+(p.pick?" done":"")); card.id = docId(s.n);
    const head = el("div","shead");
    head.append(el("span","num","No. "+String(s.n).padStart(2,"0")), el("h2",null,s.t), el("span","key",s.key));
    if (p.pick) head.append(el("span","picked"+(p.pick==="none"?" none":""), p.pick==="none" ? "REDO" : "PICKED "+p.pick));
    card.append(head, el("p","for",s.for));
    const cands = el("div","cands");
    for (const c of s.c){
      const row = el("div","cand"+(p.pick===c.l?" on":""));
      row.append(el("span","letter",c.l));
      const meta = el("div","meta");
      meta.append(el("span","src",c.s));
      const tags = el("div","tags");
      tags.append(el("span",c.k,c.k));
      if (typeof c.d === "number") tags.append(el("span",null,(c.d<10? c.d.toFixed(1): Math.round(c.d))+" s"));
      if (c.g) tags.append(el("span", c.g==="pass"?"gpass":"gfail", "gates "+c.g));
      if (c.loop) tags.append(el("span",null,"loops"));
      meta.append(tags);
      if (c.n) meta.append(el("span","note",c.n));
      const a = document.createElement("audio"); a.controls = true; a.preload = "none"; a.src = c.f; if (c.loop) a.loop = true;
      a.addEventListener("play", () => document.querySelectorAll("audio").forEach(o => { if (o!==a) o.pause(); }));
      meta.append(a);
      row.append(meta);
      const b = el("button","pick", p.pick===c.l ? "Picked" : "Pick "+c.l); b.type="button";
      b.addEventListener("click", () => save(s.n, {pick:c.l}));
      row.append(b);
      cands.append(row);
    }
    card.append(cands);
    const foot = el("div","foot");
    const redo = el("button","redo"+(p.pick==="none"?" on":""), "None of these · new takes"); redo.type="button";
    redo.addEventListener("click", () => save(s.n, {pick:"none"}));
    const note = document.createElement("input"); note.className="notein"; note.id="note-"+docId(s.n);
    note.placeholder = "Note (optional): e.g. shorter, less scary, B but slower"; note.value = p.note || "";
    note.addEventListener("change", () => save(s.n, {note: note.value.slice(0,300)}));
    foot.append(redo, note);
    card.append(foot);
    list.append(card);
  }
  const done = SOUNDS.filter(s => (picks[docId(s.n)]||{}).pick).length;
  $("#count").textContent = done + " / " + SOUNDS.length + " picked";
  $("#meter").style.width = (100*done/SOUNDS.length) + "%";
}

async function save(n, patch){
  const id = docId(n);
  const next = Object.assign({}, picks[id] || {}, patch, {sound: SOUNDS.find(s=>s.n===n).key});
  picks[id] = next;
  render();
  try { localStorage.setItem(STORE_KEY, JSON.stringify(picks)); } catch(e) {}
  if (!db){ $("#status").textContent = "Saved in this browser only: the shared sheet isn't connected, so tell Claude your picks in chat."; return; }
  try { await db.doc("picks/"+id).set(next); $("#status").textContent = "Saved. Claude can read your picks."; }
  catch(e){ $("#status").textContent = "Couldn't save that pick ("+(e && e.code || "error")+"). Tell Claude in chat instead."; }
}

try { Object.assign(picks, JSON.parse(localStorage.getItem(STORE_KEY)||"{}")); } catch(e) {}
render();

(async () => {
  const api = window.claude && window.claude.use ? await window.claude.use("db") : null;
  if (!api){ $("#status").textContent = "Picks sheet unavailable here: picks stay in this browser. Tell Claude your picks in chat."; return; }
  db = api;
  $("#status").textContent = "Connected. Picks save to the shared sheet.";
  db.collection("picks").onSnapshot(snap => {
    const docs = snap.docs || snap;
    for (const d of docs){ const v = d.data ? d.data() : d; const id = d.id; if (id) picks[id] = Object.assign({}, picks[id]||{}, v); }
    render();
  }, () => { $("#status").textContent = "Lost the live connection; picks still save when you click."; });
})();
</script>
