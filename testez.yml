---
# Selene standard-library extension for TestEZ globals.
# Used via `std = "roblox+testez"` in selene.toml so *.spec.luau files don't trip
# the `undefined_variable` lint on TestEZ's runtime-injected globals.
base: roblox
name: testez
globals:
  describe:
    args:
      - type: string
      - type: function
  it:
    args:
      - type: string
      - type: function
  expect:
    args:
      - type: any
  beforeEach:
    args:
      - type: function
  afterEach:
    args:
      - type: function
  beforeAll:
    args:
      - type: function
  afterAll:
    args:
      - type: function
  FOCUS:
    args: []
  SKIP:
    args: []
  # Skip variants: the multi-slot specs alias these (`itMultiSlot`) so they skip while MAX_SLOTS = 1.
  itSKIP:
    args:
      - type: string
      - type: function
  describeSKIP:
    args:
      - type: string
      - type: function
